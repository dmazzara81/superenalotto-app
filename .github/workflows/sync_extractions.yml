name: SuperEnalotto Auto-Sync

on:
  schedule:
    # Esegue il workflow OGNI GIORNO alle 19:45 UTC (20:45 o 21:45 in Italia)
    # Eseguirlo tutti i giorni ci protegge dai cambi di data per festività
    - cron: '45 19 * * *'
  workflow_dispatch: # Permette di avviare il workflow manualmente dal sito di GitHub

jobs:
  sync_extractions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 supabase

      - name: Run Fetch Extractions Script
        run: python backend/auto_fetch_extractions.py
