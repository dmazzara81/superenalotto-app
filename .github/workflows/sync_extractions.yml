name: SuperEnalotto Auto-Sync

on:
  schedule:
    # Controlli multipli la sera per intercettare l'estrazione appena esce.
    # Orari UTC: 19:30, 20:00, 20:30, 21:00 (corrispondono a 21:30, 22:00, 22:30, 23:00 in Italia)
    - cron: '30 19 * * *'
    - cron: '0 20 * * *'
    - cron: '30 20 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch: # Permette di avviare il workflow manualmente dal sito di GitHub

jobs:
  sync_extractions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 supabase numpy google-genai

      - name: Run Fetch Extractions Script
        run: python backend/auto_fetch_extractions.py

      - name: Run AI Generation & Supabase Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backend/sync_to_supabase.py
