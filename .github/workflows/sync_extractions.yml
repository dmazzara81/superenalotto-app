name: SuperEnalotto Auto-Sync

on:
  schedule:
    # Esegue il workflow ogni Martedì(2), Giovedì(4), Venerdì(5), Sabato(6) alle 19:45 UTC
    # (Corrisponde alle 20:45 CET in Inverno e 21:45 CEST in Estate)
    - cron: '45 19 * * 2,4,5,6'
  workflow_dispatch: # Permette di avviare il workflow manualmente dal sito di GitHub

jobs:
  sync_extractions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 supabase

      - name: Run Fetch Extractions Script
        run: python backend/auto_fetch_extractions.py
